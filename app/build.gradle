plugins {
    id 'com.android.application'
}

// En GitHub Actions cada compilación sube el número de versión,
// así cada APK nuevo se instala encima del anterior.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.example.spacegame'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.spacegame'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Firma fija: si existe app/debug.keystore se usa siempre la misma llave,
    // y así las actualizaciones se instalan sin tener que desinstalar el juego.
    signingConfigs {
        debug {
            def ks = file('debug.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
